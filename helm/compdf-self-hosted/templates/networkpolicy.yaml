{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compdf.fullname" . }}-server-ingress
  labels:
    {{- include "compdf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compdf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compdf.fullname" . }}-internal
  labels:
    {{- include "compdf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compdf.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compdf.selectorLabels" . | nindent 14 }}
{{- end }}
