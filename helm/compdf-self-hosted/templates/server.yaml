apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "compdf.fullname" . }}-server-storage
  labels:
    {{- include "compdf.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.server.storage.storageClassName }}
  storageClassName: {{ .Values.server.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.server.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compdf.fullname" . }}-server
  labels:
    {{- include "compdf.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "compdf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compdf.fullname" . }}-server
  labels:
    {{- include "compdf.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "compdf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "compdf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "compdf.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: initialize-settings
          image: {{ include "compdf.image" (list .Values.images.server .) | quote }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command:
            - sh
            - -c
            - set -eu; test -s /app/storage/settings.yml || cp /defaults/settings.yml /app/storage/settings.yml
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: settings-template
              mountPath: /defaults
              readOnly: true
      containers:
        - name: server
          image: {{ include "compdf.image" (list .Values.images.server .) | quote }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command: ["sh", "-c", "npm run init:db && npm run start"]
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: COMPDF_VERSION
              value: {{ .Values.server.productVersion | quote }}
            - name: COMPDF_DB_SCHEMA_VERSION
              value: {{ .Values.server.databaseSchemaVersion | quote }}
            - name: DATABASE_HOST
              value: {{ include "compdf.databaseHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ ternary .Values.infra.mysqlPort .Values.external.databasePort .Values.infra.enabled | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_USER
              value: {{ .Values.database.user | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: REDIS_HOST
              value: {{ include "compdf.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ ternary .Values.infra.redisPort .Values.external.redisPort .Values.infra.enabled | quote }}
            - name: PDF_SDK_BASE_URL
              value: {{ printf "http://%s-app:7001" (include "compdf.fullname" .) | quote }}
            - name: CONVERSION_BASE_URL
              value: {{ printf "http://%s-app:7000" (include "compdf.fullname" .) | quote }}
            - name: LICENSE_TOKEN_PATH
              value: /app/configs/license.jwt
            - name: SETTINGS_PATH
              value: /app/storage/settings.yml
            - name: MCP_ENABLED
              value: {{ .Values.server.mcp.enabled | quote }}
            - name: MCP_PUBLIC_URL
              value: {{ printf "%s/mcp" (trimSuffix "/" .Values.server.publicBaseUrl) | quote }}
            - name: MCP_ALLOWED_HOSTS
              value: {{ .Values.server.mcp.allowedHosts | quote }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ .Values.server.mcp.allowedOrigins | quote }}
            - name: MCP_MAX_INLINE_FILE_BYTES
              value: {{ .Values.server.mcp.maxInlineFileBytes | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.server.corsOrigins | quote }}
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: license
              mountPath: /app/configs/license.jwt
              subPath: {{ .Values.license.key }}
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "compdf.fullname" . }}-server-storage
        - name: settings-template
          configMap:
            name: {{ default (printf "%s-settings" (include "compdf.fullname" .)) .Values.settings.existingConfigMap }}
        - name: license
          secret:
            secretName: {{ .Values.license.existingSecret }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
