global_defs {
    router_id COMPDF_NGINX_1
    enable_script_security
    script_user root
}

vrrp_script check_nginx {
    script "/etc/keepalived/check-nginx.sh"
    interval 2
    timeout 2
    fall 3
    rise 2
    weight -20
}

vrrp_instance COMPDF_VIP {
    state BACKUP
    interface eth0
    virtual_router_id 71
    priority 150
    advert_int 1
    nopreempt

    authentication {
        auth_type PASS
        auth_pass CHANGEME
    }

    unicast_src_ip 10.0.10.21
    unicast_peer {
        10.0.10.22
    }

    virtual_ipaddress {
        10.0.10.20/24 dev eth0
    }

    track_script {
        check_nginx
    }
}
