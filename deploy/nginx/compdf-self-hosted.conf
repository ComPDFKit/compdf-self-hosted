upstream compdf_server {
    least_conn;
    keepalive 32;

    server 10.0.10.11:8080 max_fails=3 fail_timeout=10s;
    server 10.0.10.12:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name compdf.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;

    location = /api/v1/status {
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://compdf_server;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name compdf.example.com;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 500m;
    client_body_timeout 300s;

    access_log /var/log/nginx/compdf-access.log combined;
    error_log /var/log/nginx/compdf-error.log warn;

    location = /api/v1/status {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://compdf_server;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass http://compdf_server;
    }
}
